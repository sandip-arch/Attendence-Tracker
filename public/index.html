<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker - Portal Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        Attendance<span class="brand-accent">Tracker</span>
      </div>
      <div class="nav-user">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Secure Portal</span>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card glass-panel">
      
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</div>
      </div>

      <!-- Alerts -->
      <div id="auth-alert-success" class="alert alert-success"></div>
      <div id="auth-alert-danger" class="alert alert-danger"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="name@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Sign Into Dashboard
        </button>
      </form>

      <!-- Registration Form -->
      <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" class="form-control" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="register-email">Email Address</label>
          <input type="email" id="register-email" class="form-control" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="form-control" placeholder="Minimum 6 characters">
        </div>
        <div class="form-group">
          <label for="register-session">Request Session / Season</label>
          <select id="register-session" class="form-control">
            <option value="" disabled selected>Select a session (e.g., s2, s3)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Submit Registration
        </button>
      </form>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Load sessions dynamically on load
    document.addEventListener('DOMContentLoaded', () => {
      // Check if user is already logged in, redirect accordingly
      const token = localStorage.getItem('token');
      const role = localStorage.getItem('role');
      if (token && role) {
        if (role === 'admin') window.location.href = 'admin.html';
        else if (role === 'student') window.location.href = 'student.html';
      }
      loadSessionsDropdown();
    });
  </script>
</body>
</html>
